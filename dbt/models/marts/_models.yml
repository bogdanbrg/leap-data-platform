version: 2

models:
  - name: fct_orders
    description: One row per order, with line items aggregated to order grain.
    columns:
      - name: order_key
        description: Primary key. One row per order.
        data_tests: [unique, not_null]
      - name: customer_key
        description: Foreign key to dim_customer.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['O', 'F', 'P']

  - name: dim_customer
    description: One row per customer.
    columns:
      - name: customer_key
        data_tests: [unique, not_null]
      - name: nation_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_nation')
                field: nation_key

  - name: dim_nation
    description: One row per nation, with its region denormalised in.
    columns:
      - name: nation_key
        data_tests: [unique, not_null]
      - name: nation_name
        data_tests: [not_null]
